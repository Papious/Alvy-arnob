  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 60px;
      border-bottom: 1px solid rgba(191, 144, 73, 0.2);
    }
    .nav-logo {
      color: #fff;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: 300;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-logo span { color: #bf9049; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #bf9049;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease;
    }
    .nav-link:hover { color: #bf9049; }
    .nav-link:hover::after { transform: scaleX(1); }


    /* ===== MAIN ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }
    h1 {
      color: #bf9049;
      font-size: 48px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 400;
      font-family: 'Georgia', serif;
      text-align: center;
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 64px 24px 32px;
      border-top: 1px solid rgba(191, 144, 73, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .footer-links {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 48px;
      margin: 0 auto 96px;
      width: auto;
      max-width: 100%;
    }
    .footer-link {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 0;
      font-family: 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      border: none;
      transition: color 0.3s ease;
    }
    .footer-link .fl-arrow {
      color: #bf9049;
      font-size: 11px;
      line-height: 1;
      display: inline-block;
      transform: translateY(-4px);
      transition: transform .3s ease, color .3s ease;
    }
    .footer-link:hover { color: #bf9049; }
    .footer-link:hover .fl-arrow { transform: translate(4px, -8px); }
    .footer-name {
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: clamp(48px, 9vw, 140px);
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 400;
      text-align: center;
      margin: 0 auto 32px;
      opacity: 0;
      transform: translateY(60px) scale(.96);
      transition: opacity .3s ease, transform .3s ease;
      will-change: opacity, transform;
    }
    .footer-name span { color: #bf9049; }
    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 20px;
      border-top: 1px solid rgba(191,144,73,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-family: 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .footer-bottom a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .3s ease;
    }
    .footer-bottom a:hover { color: #bf9049; }
    .footer-divider { display: none; }

    @media (max-width: 720px) {
      .navbar { padding: 20px 24px; }
      .nav-links { gap: 20px; }
      .nav-link { font-size: 11px; letter-spacing: 1px; }
      h1 { font-size: 28px; letter-spacing: 3px; }
      .footer-links { gap: 24px; margin-bottom: 64px; }
      .footer-bottom { flex-direction: column; text-align: center; font-size: 10px; }
    }
  </style>

  <script>
    (function () {
      function updateFooterWordmark() {
        const vh = window.innerHeight;
        document.querySelectorAll('.footer-name').forEach(el => {
          const r = el.getBoundingClientRect();
          const start = vh, end = vh * 0.75;
          let p = (start - r.top) / (start - end);
          p = Math.max(0, Math.min(1, p));
          if (p > 0.92) p = 1;
          el.style.opacity = p === 1 ? '1' : p.toFixed(3);
          el.style.transform = p === 1 ? 'none' : `translateY(${((1 - p) * 60).toFixed(1)}px) scale(${(0.96 + p * 0.04).toFixed(3)})`;
        });
      }
      let tick = false;
      window.addEventListener('scroll', () => {
        if (!tick) { requestAnimationFrame(() => { updateFooterWordmark(); tick = false; }); tick = true; }
      }, { passive: true });
      window.addEventListener('resize', updateFooterWordmark, { passive: true });
      window.addEventListener('load', updateFooterWordmark);
      document.addEventListener('DOMContentLoaded', updateFooterWordmark);
    })();
  </script>
